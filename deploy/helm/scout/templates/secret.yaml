{{- if not .Values.postgres.existingSecret }}
{{- $name := printf "%s-postgres" (include "scout.fullname" .) }}
{{- /* Keep the password across upgrades: reuse the live Secret, else take the value, else generate. */}}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.postgres.password }}
{{- if and (not $password) $live }}{{ $password = index $live.data "password" | b64dec }}{{ end }}
{{- if not $password }}{{ $password = randAlphaNum 24 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "scout.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
