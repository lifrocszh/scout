{{- if .Values.kafka.enabled }}
{{- /* Optional Kafka ingestion log (ADR 0003): one combined broker and controller in KRaft mode.
       Downstream of Postgres only; the crawl never waits for it. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scout.kafkaHost" . }}
  labels:
    {{- include "scout.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "scout.selector" (dict "root" . "component" "kafka") | nindent 4 }}
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "scout.kafkaHost" . }}
  labels:
    {{- include "scout.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "scout.kafkaHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "scout.selector" (dict "root" . "component" "kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scout.labels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      # The image's user is appuser (1000).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://{{ include "scout.kafkaHost" . }}:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # The relay creates its topics; a typo must not create a stray one.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            # 21 MiB: a 16 MiB body (the distributed cap) plus its headers fits one record.
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "22020096"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: {{ .Values.kafka.retentionHours | quote }}
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/logs
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          ports:
            - name: kafka
              containerPort: 9092
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            # The image's start script writes the broker config under /opt/kafka/config.
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "scout.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.kafka.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
{{- end }}
