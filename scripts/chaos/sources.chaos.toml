# Crawl config for the failure-injection suite (scripts/chaos/run.sh): four
# synthetic origins on `chaos-fixture`, 40 pages each by default
# (CHAOS_PAGES_PER_ORIGIN), every page answering after 400 ms.
schema_version = "scout.sources.v1"
contact_url = "https://github.com/lifrocszh/scout"
user_agent = "ScoutChaos/0.1 (+https://github.com/lifrocszh/scout)"
embedding_model = "BAAI/bge-small-en-v1.5"

# Above the page count, so every run ends because the frontier is exhausted:
# a run that lost or duplicated a page cannot hide behind a quota.
page_target = 1000
max_frontier = 2000
max_duration_seconds = 600

# A lease is twice the request timeout: 4 s, renewed every ~1.3 s. Short, so a
# lease lost to a fault expires and is reclaimed within seconds.
request_timeout_seconds = 2
global_concurrency = 8
origin_concurrency = 2
min_start_spacing_ms = 100

[[sources]]
source_id = "chaos"
seeds = [
  "http://chaos-fixture:9000/p/0",
  "http://chaos-fixture:9001/p/0",
  "http://chaos-fixture:9002/p/0",
  "http://chaos-fixture:9003/p/0",
]
allowed_origins = [
  "http://chaos-fixture:9000",
  "http://chaos-fixture:9001",
  "http://chaos-fixture:9002",
  "http://chaos-fixture:9003",
]
path_prefixes = ["/"]
