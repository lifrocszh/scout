name: Image

# Publishes ghcr.io/lifrocszh/scout (free for public repositories).
#   push to main  -> :<commit sha> and :latest
#   push of v*    -> :<commit sha> and :<version> (v1.2.3 -> 1.2.3, 1.2)
on:
  push:
    branches: [main]
    tags: ["v*"]

# No write access by default; only the publish job below gets packages: write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/lifrocszh/scout
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=scout-image
          cache-to: type=gha,mode=max,scope=scout-image
          # Attestation manifests would add untagged entries to the package; add
          # them when image signing is wanted.
          provenance: false
          sbom: false
