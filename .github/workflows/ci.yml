name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs also include the macOS feature check (Actions → CI → Run workflow).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so new stable clippy lints do not break main unannounced.
  RUST_TOOLCHAIN: "1.97"
  # Smaller target dirs and caches; keeps file/line info in backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  test-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-run
      - run: scripts/ci/postgres-tests.sh

  # The optional Kafka ingestion log (ADR 0003) against a real broker: a crawl, the outbox relay
  # and the reducer, each crashed once mid-delivery, and the replica checked against the live
  # snapshot (tests/kafka_log.rs). The Compose wiring runs in kafka.yml.
  test-kafka:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      kafka:
        image: apache/kafka:4.1.2
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      SCOUT_TEST_KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-run
      - run: scripts/ci/postgres-tests.sh kafka_log

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 -B tests/local_monitor_test.py
      - run: python3 -B scripts/databricks/test_transport_state.py
      - run: python3 -B tests/search_quality_test.py
      - run: python3 -B tests/scaling_benchmark_test.py

  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --features openvino-gpu

  # Search-quality regression gate (docs/search-quality-gate.md). Crawls the
  # fixture corpus in data/eval, builds keyword, semantic and hybrid indexes, and
  # fails when NDCG@10, Recall@10 or MRR of any mode drops more than the limit
  # below data/eval/baseline.json. The before/after table is in the job summary.
  search-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Largest tolerated drop per metric.
      SEARCH_QUALITY_MAX_DROP: "0.02"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      # fastembed downloads BGE Small on first use. The build verifies the cached
      # files against the hashes pinned in data/eval/index-profile.toml, so the
      # cache key only needs the model revision.
      - name: Model revision
        id: model
        run: echo "revision=$(sed -n 's/^model_revision = "\(.*\)"/\1/p' data/eval/index-profile.toml)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/search-quality/models
          key: bge-small-en-v1.5-${{ steps.model.outputs.revision }}
      - name: Search-quality gate
        run: scripts/ci/search-quality.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-results
          path: |
            data/search-quality/results.json
            data/search-quality/evaluations/*/report.json
          if-no-files-found: ignore
          retention-days: 14

  # Builds the image (dependency layers come from the GitHub Actions cache) and
  # runs the Compose stack end to end against the fixture site: crawl with
  # 3 workers, keyword index, /v1/readyz, search assertions. The obs profile runs
  # too (Prometheus, Grafana): the key metrics must reach Prometheus and the
  # dashboard must be provisioned (scripts/ci/compose-obs-checks.sh).
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SCOUT_IMAGE: scout:ci
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.SCOUT_IMAGE }}
          cache-from: type=gha,scope=scout-image
          # Only main writes the cache, so PR runs cannot evict it.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=scout-image' || '' }}
      - name: Image size
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' "$SCOUT_IMAGE"
      - name: Compose smoke test
        run: scripts/ci/compose-smoke.sh 3

  # The Helm chart (deploy/helm/scout): lint, render the main variants, and validate what they
  # render against the Kubernetes schemas. The cluster tests are in e2e-kind.yml.
  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - run: helm version --short
      - run: make helm-lint

  # Manual only: macOS runners can queue for a long time, and this guards a small
  # cfg(target_os = "macos") branch in src/generation/embeddings.rs.
  features-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --features apple-coreml
