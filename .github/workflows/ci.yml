name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs also include the macOS feature check (Actions → CI → Run workflow).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so new stable clippy lints do not break main unannounced.
  RUST_TOOLCHAIN: "1.97"
  # Smaller target dirs and caches; keeps file/line info in backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  test-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-run
      - run: scripts/ci/postgres-tests.sh

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 -B tests/local_monitor_test.py
      - run: python3 -B scripts/databricks/test_transport_state.py
      - run: python3 -B tests/search_quality_test.py
      - run: python3 -B tests/scaling_benchmark_test.py

  # Local lakehouse (docs/lakehouse.md): tests, then the fixture crawl -> Delta tables -> data
  # quality -> example DuckDB queries, then every deliberately broken fixture, which must trip
  # a data-quality rule (exit 1, not a crash).
  lakehouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - run: python -m pip install -r analytics/requirements.txt
      - run: python -B analytics/tests/test_lakehouse.py
      - name: Fixture crawl to tables and queries
        run: python -B -m analytics.lakehouse demo
      - name: Broken fixtures fail data quality
        run: |
          for kind in schema-drift event-conflict event-schema stale; do
            code=0
            python -B -m analytics.lakehouse demo --broken "$kind" >/dev/null 2>stderr.txt || code=$?
            cat stderr.txt
            [ "$code" = 1 ] || { echo "::error::demo --broken $kind exited $code, want 1"; exit 1; }
          done

  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --features openvino-gpu

  # Search-quality regression gate (docs/search-quality-gate.md). Crawls the
  # fixture corpus in data/eval, builds keyword, semantic and hybrid indexes, and
  # fails when NDCG@10, Recall@10 or MRR of any mode drops more than the limit
  # below data/eval/baseline.json. The before/after table is in the job summary.
  search-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Largest tolerated drop per metric.
      SEARCH_QUALITY_MAX_DROP: "0.02"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      # fastembed downloads BGE Small on first use. The build verifies the cached
      # files against the hashes pinned in data/eval/index-profile.toml, so the
      # cache key only needs the model revision.
      - name: Model revision
        id: model
        run: echo "revision=$(sed -n 's/^model_revision = "\(.*\)"/\1/p' data/eval/index-profile.toml)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/search-quality/models
          key: bge-small-en-v1.5-${{ steps.model.outputs.revision }}
      - name: Search-quality gate
        run: scripts/ci/search-quality.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-results
          path: |
            data/search-quality/results.json
            data/search-quality/evaluations/*/report.json
          if-no-files-found: ignore
          retention-days: 14

  # Builds the image (dependency layers come from the GitHub Actions cache) and
  # runs the Compose stack end to end against the fixture site: crawl with
  # 3 workers, keyword index, /v1/readyz, search assertions. The obs profile runs
  # too (Prometheus, Grafana): the key metrics must reach Prometheus and the
  # dashboard must be provisioned (scripts/ci/compose-obs-checks.sh).
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SCOUT_IMAGE: scout:ci
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.SCOUT_IMAGE }}
          cache-from: type=gha,scope=scout-image
          # Only main writes the cache, so PR runs cannot evict it.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=scout-image' || '' }}
      - name: Image size
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' "$SCOUT_IMAGE"
      - name: Compose smoke test
        run: scripts/ci/compose-smoke.sh 3

  # The Helm chart (deploy/helm/scout): lint, render the main variants, and validate what they
  # render against the Kubernetes schemas. The cluster tests are in e2e-kind.yml.
  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - run: helm version --short
      - run: make helm-lint

  # Manual only: macOS runners can queue for a long time, and this guards a small
  # cfg(target_os = "macos") branch in src/generation/embeddings.rs.
  features-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --features apple-coreml
