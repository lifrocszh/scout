<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12">
<title id="t">Scout crawl throughput against worker count, with the CPU each role used</title>
<desc id="d">Measured pages per second for 1, 2, 4, 8 workers against linear scaling, and cores used by the coordinator, the workers, Postgres and the origin pod. The same numbers are in the report's tables.</desc>
<style>:root{color-scheme:light dark;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;}@media (prefers-color-scheme:dark){:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;}}text{fill:var(--ink2)}.t{fill:var(--ink);font-size:14px;font-weight:600}.m{fill:var(--muted)}.g{stroke:var(--grid);stroke-width:1}.a{stroke:var(--axis);stroke-width:1}.l{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dot{stroke:var(--surface);stroke-width:2}</style>
<rect width="980" height="440" fill="var(--surface)"/>
