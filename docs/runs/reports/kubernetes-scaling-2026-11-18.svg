<text class="m" x="56" y="92.0" text-anchor="end">80</text>
<text class="m" x="86.7" y="372" text-anchor="middle">1</text>
<text class="m" x="132.0" y="372" text-anchor="middle">2</text>
<text class="m" x="222.7" y="372" text-anchor="middle">4</text>
<text class="m" x="404.2" y="372" text-anchor="middle">8</text>
<text class="m" x="257" y="392" text-anchor="middle">workers</text>
<text class="t" x="64" y="32">Pages per second</text>
<line class="l" stroke="var(--muted)" x1="86.7" y1="325.7" x2="404.2" y2="141.6"/>
<text class="m" x="398.2" y="133.6" text-anchor="end">linear scaling</text>
<line stroke="var(--s1)" stroke-width="1.5" x1="86.7" x2="86.7" y1="326.0" y2="325.3"/>
<line stroke="var(--s1)" stroke-width="1.5" x1="132.0" x2="132.0" y1="302.4" y2="301.5"/>
<line stroke="var(--s1)" stroke-width="1.5" x1="222.7" x2="222.7" y1="257.8" y2="255.6"/>
<line stroke="var(--s1)" stroke-width="1.5" x1="404.2" x2="404.2" y1="189.0" y2="179.1"/>
<polyline class="l" stroke="var(--s1)" points="86.7,325.7 132.0,302.1 222.7,257.0 404.2,182.7"/>
<circle class="dot" cx="86.7" cy="325.7" r="5" fill="var(--s1)"><title>1 workers: 8.0 pages/s (min 7.9, max 8.1, 3 runs)</title></circle>
<circle class="dot" cx="132.0" cy="302.1" r="5" fill="var(--s1)"><title>2 workers: 15.1 pages/s (min 15.0, max 15.3, 3 runs)</title></circle>
<circle class="dot" cx="222.7" cy="257.0" r="5" fill="var(--s1)"><title>4 workers: 28.8 pages/s (min 28.5, max 29.2, 3 runs)</title></circle>
<circle class="dot" cx="404.2" cy="182.7" r="5" fill="var(--s1)"><title>8 workers: 51.3 pages/s (min 49.4, max 52.4, 3 runs)</title></circle>
<text x="86.7" y="347.7" text-anchor="middle" style="fill:var(--ink)">8.0</text>
