[package]
name = "scout"
version = "0.1.0"
edition = "2024"

[features]
openvino-gpu = ["dep:ort", "ort/openvino", "ort/load-dynamic"]
apple-coreml = ["dep:ort", "ort/coreml"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
postgres = "0.19.12"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "brotli", "deflate", "gzip", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
scraper = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tantivy = "0.26.2"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.14.2", features = ["transport"] }
tonic-prost = "0.14.2"
prost = "0.14.1"
toml = "0.8.23"
usearch = "2.26.2"
fastembed = { version = "7.0.1", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
ort = { version = "=2.0.0-rc.13", default-features = false, optional = true }
url = "2.5.8"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.2"

[dev-dependencies]
