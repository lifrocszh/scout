[package]
name = "scout"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "brotli", "deflate", "gzip", "rustls-tls"] }
scraper = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tantivy = "0.26.2"
toml = "0.8.23"
usearch = "2.26.2"
fastembed = { version = "7.0.1", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
url = "2.5.8"

[dev-dependencies]
