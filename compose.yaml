# Scout on Docker Compose.
#
#   cp .env.example .env          # set POSTGRES_PASSWORD
#   docker compose up --scale worker=3
#
# Core stack (always on): Postgres, a static fixture site, a coordinator with N
# workers, a one-shot index build, and the search API. The flow is
#   crawl (coordinator + workers) -> materialize -> keyword index -> activate -> serve
# and ends with http://127.0.0.1:8080/v1/readyz returning OK. See README.md.
#
# One image runs every role; the subcommand picks the role. Configuration is
# environment and command line only. The sources config and index profile are
# mounted read-only from ./docker, not baked into the image.
#
# Profiles. Services that join a profile set `profiles: [<name>]`, so a plain
# `docker compose up` stays at the core stack:
#   obs   Prometheus + Grafana scraping every Scout process:
#           docker compose --profile obs up --scale worker=3
#         Grafana: http://127.0.0.1:3000 (dashboard "Scout overview").
#         Prometheus: http://127.0.0.1:9090. The fixture crawl ends in seconds, so
#         keep the processes up for a last scrape with SCOUT_METRICS_LINGER_SECS=10.
#   kafka Apache Kafka (KRaft, one node), the outbox relay and a reducer that rebuilds the
#         snapshot from Kafka alone and checks it against the live one (ADR 0003, #13):
#           docker compose --profile kafka up --scale worker=3
#         Optional: the core stack never waits for it. `docker compose logs kafka-reducer` ends
#         with a JSON summary; "parity": true means the replay matched. Slow the reducer down
#         with SCOUT_KAFKA_RECORD_DELAY_MS=500 to watch its lag in Grafana (with --profile obs).
#         Kafka listens on 127.0.0.1:${KAFKA_PORT:-9094} for host tools.
#   data  Every data-plane service; today the kafka services above.
#
# The coordinator, workers and serve always serve /metrics on a port inside the
# Compose network (SCOUT_METRICS_BIND). Nothing publishes those ports, so the
# core stack is unchanged without the obs profile.

name: scout

x-scout: &scout
  # Builds from ./Dockerfile when the image is absent. To run the published
  # image instead:  SCOUT_IMAGE=ghcr.io/lifrocszh/scout:latest docker compose up --no-build
  image: ${SCOUT_IMAGE:-scout:local}
  build: .
  init: true # scout does not handle SIGTERM when it is PID 1
  restart: "no"
  # The coordinator and workers shut down gracefully on SIGINT only.
  stop_signal: SIGINT
  environment: &scout-env
    SCOUT_DATABASE_URL: postgresql://scout:${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}@postgres:5432/scout

x-crawl-run-id: &crawl-run-id
  # run- plus 64 hex characters. Fixed, so the coordinator and the index step
  # agree on the run without sharing state. Change it for a fresh crawl on an
  # existing volume.
  SCOUT_CRAWL_RUN_ID: ${SCOUT_CRAWL_RUN_ID:-run-5c0a7f1e0d3b4a29b8e6f4a1c7d2e9035b8a6f4c1e7d0a39b2c5e8f1a4d7b0c3}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: scout
      POSTGRES_DB: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Static site the stack crawls: a few HTML pages, robots.txt (with one
  # disallowed path) and a sitemap (listing one page nothing links to).
  fixture:
    image: busybox:1.37
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    volumes:
      - ./docker/fixture/site:/www:ro
    read_only: true
    user: "65534:65534"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/robots.txt"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Hands out crawl tasks to workers and stores captured pages under /data.
  # Exits 0 when the crawl completes. It has no authentication: the gRPC port is
  # never published, only reachable from this Compose network.
  coordinator:
    <<: *scout
    entrypoint: ["/bin/bash", "/opt/scout/stack.sh"]
    command: ["coordinator"]
    environment:
      <<: [*scout-env, *crawl-run-id]
      SCOUT_METRICS_BIND: 0.0.0.0:9101
      # How often the frontier-depth gauges are sampled from Postgres.
      SCOUT_METRICS_SAMPLE_SECS: ${SCOUT_METRICS_SAMPLE_SECS:-2}
      # Seconds to keep serving /metrics after the crawl, for a final scrape.
      SCOUT_METRICS_LINGER_SECS: ${SCOUT_METRICS_LINGER_SECS:-0}
    volumes:
      - scout-data:/data
      - scout-models:/data/models
      - ./docker/stack.sh:/opt/scout/stack.sh:ro
      - ${SCOUT_SOURCES_CONFIG_FILE:-./docker/sources.fixture.toml}:/etc/scout/sources.toml:ro
    depends_on:
      postgres: {condition: service_healthy}
      fixture: {condition: service_healthy}
    # A crashed coordinator restarts and resumes the same run from Postgres and
    # the capture spool; workers restart too and rejoin. Exit 0 (crawl done)
    # is final. See docs/runbook.md.
    restart: on-failure:10
    healthcheck:
      # The container resolves its own service name; this checks the gRPC port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/coordinator/50051"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Scale with `--scale worker=N`. Workers keep no state (events go to /tmp) and
  # exit 0 when the coordinator reports the crawl finished. They need no
  # database credentials: only the coordinator talks to Postgres.
  worker:
    <<: *scout
    entrypoint: ["/bin/bash", "/opt/scout/stack.sh"]
    command: ["worker"]
    environment:
      <<: *crawl-run-id
      SCOUT_METRICS_BIND: 0.0.0.0:9102
      SCOUT_METRICS_LINGER_SECS: ${SCOUT_METRICS_LINGER_SECS:-0}
    volumes:
      # Read-only: stack.sh only reads the event log to tell whether the crawl
      # is already done. Not healthy-gated: see stack.sh worker.
      - scout-data:/data:ro
      - ./docker/stack.sh:/opt/scout/stack.sh:ro
    restart: on-failure:10
    depends_on:
      coordinator: {condition: service_started}

  # One-shot: snapshot the finished crawl, build a keyword-only Generation,
  # activate and verify it.
  index:
    <<: *scout
    entrypoint: ["/bin/bash", "/opt/scout/stack.sh"]
    command: ["index"]
    environment:
      SCOUT_INDEX_MODE: ${SCOUT_INDEX_MODE:-keyword-only}
      # With the database, materializing also publishes the sealed snapshot to the outbox as the
      # run's last event (corpus_snapshot_published), which outbox consumers such as the kafka
      # profile's relay and reducer wait for.
      <<: [*scout-env, *crawl-run-id]
    volumes:
      - scout-data:/data
      - scout-models:/data/models
      - ./docker/stack.sh:/opt/scout/stack.sh:ro
      - ${SCOUT_SOURCES_CONFIG_FILE:-./docker/sources.fixture.toml}:/etc/scout/sources.toml:ro
      - ./docker/index-profile.toml:/etc/scout/index-profile.toml:ro
    depends_on:
      coordinator: {condition: service_completed_successfully}

  # Search API (no TLS or authentication): published on loopback only.
  serve:
    <<: *scout
    command: ["serve", "--data-dir", "/data", "--bind", "0.0.0.0:8080"]
    environment:
      SCOUT_METRICS_BIND: 0.0.0.0:9103
    volumes:
      - scout-data:/data
      - scout-models:/data/models
    ports:
      - "127.0.0.1:${SCOUT_HTTP_PORT:-8080}:8080"
    depends_on:
      index: {condition: service_completed_successfully}
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /v1/readyz HTTP/1.0\r\n\r\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- obs profile: docker compose --profile obs up ------------------------------------------
  # Both services publish on loopback only and keep no secrets. Config and the
  # dashboard are mounted read-only from ./deploy.

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  grafana:
    profiles: [obs]
    image: grafana/grafana-oss:12.4.3
    environment:
      # Anonymous viewers can open the dashboard; edits need the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/scout.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ---- kafka profile: docker compose --profile kafka up ----------------------------------------
  # Kafka is downstream of Postgres, never in front of it: the coordinator accepts results and
  # writes the outbox exactly as without this profile.

  kafka:
    profiles: [kafka, data]
    image: apache/kafka:4.1.2
    environment:
      # One combined broker and controller in KRaft mode (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The relay creates its topics; a typo must not create a stray one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 21 MiB: a 16 MiB body (the distributed cap) plus its headers fits one record.
      KAFKA_MESSAGE_MAX_BYTES: 22020096
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Copies the run's outbox into Kafka as the crawl goes, and exits once the snapshot the
  # `index` service publishes is in Kafka too. Reads bodies from the coordinator's volume.
  kafka-relay:
    <<: *scout
    profiles: [kafka, data]
    entrypoint: ["/bin/bash", "/opt/scout/stack.sh"]
    command: ["kafka-relay"]
    environment:
      <<: [*scout-env, *crawl-run-id]
      SCOUT_KAFKA_BOOTSTRAP: kafka:9092
      SCOUT_METRICS_BIND: 0.0.0.0:9104
      SCOUT_METRICS_LINGER_SECS: ${SCOUT_METRICS_LINGER_SECS:-0}
    volumes:
      - scout-data:/data:ro
      - ./docker/stack.sh:/opt/scout/stack.sh:ro
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: on-failure:10

  # Rebuilds the snapshot from Kafka alone (no Postgres, no coordinator volume, no fetches) into
  # its own volume, then exits 0 if it equals the live snapshot and 1 if it does not.
  kafka-reducer:
    <<: *scout
    profiles: [kafka, data]
    entrypoint: ["/bin/bash", "/opt/scout/stack.sh"]
    command: ["kafka-reduce"]
    environment:
      <<: *crawl-run-id
      SCOUT_KAFKA_BOOTSTRAP: kafka:9092
      SCOUT_KAFKA_RECORD_DELAY_MS: ${SCOUT_KAFKA_RECORD_DELAY_MS:-0}
      SCOUT_METRICS_BIND: 0.0.0.0:9105
      SCOUT_METRICS_LINGER_SECS: ${SCOUT_METRICS_LINGER_SECS:-0}
    volumes:
      # Its own /data (the image's directory, so the volume is owned by the scout user).
      - kafka-replica:/data
      - ./docker/stack.sh:/opt/scout/stack.sh:ro
      - ${SCOUT_SOURCES_CONFIG_FILE:-./docker/sources.fixture.toml}:/etc/scout/sources.toml:ro
    depends_on:
      kafka: {condition: service_healthy}
    restart: on-failure:10

volumes:
  pgdata:
  # Crawl spool, corpus snapshots, index Generations and event logs.
  scout-data:
  # Embedding model cache (<data-dir>/models). Empty for keyword-only builds;
  # hybrid/semantic builds download the BGE Small model here on first use. Kept
  # as its own volume so it survives removing scout-data.
  scout-models:
  # Prometheus time series (obs profile), kept for 3 days.
  prometheus-data:
  # Kafka's log (kafka profile), and the reducer's replica: spool, bodies, snapshot, offsets.
  kafka-data:
  kafka-replica:
