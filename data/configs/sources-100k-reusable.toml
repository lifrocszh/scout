# Reusable broad-crawl profile derived from run 94 policy.
# Unlike the frozen run config, this uses a small set of section-root seeds and
# path allowlists instead of enumerated seeds/allowed_urls. Crawl scope can differ.
schema_version = "scout.sources.v1"
contact_url = "https://github.com/lifrocszh/scout"
user_agent = "Scout/0.1 (+https://github.com/lifrocszh/scout)"
page_target = 100000
embedding_model = "BAAI/bge-small-en-v1.5"
global_concurrency = 8
origin_concurrency = 1
min_start_spacing_ms = 500
max_frontier = 150000
max_decoded_body_bytes = 8388608
max_extraction_bytes = 8388608
max_extraction_millis = 5000
request_timeout_seconds = 30
max_attempts = 2
retry_backoff_ms = 1000
retry_max_delay_ms = 10000
max_total_attempts = 260000
max_duration_seconds = 86400
robots_cache_seconds = 86400
max_passage_tokens = 384

# Each allowed origin has an explicit request budget. These match the former
# shared defaults, so this profile keeps its existing effective rates.
[[origins]]
origin = "https://doc.rust-lang.org"
origin_concurrency = 1
min_start_spacing_ms = 500

[[origins]]
origin = "https://kubernetes.io"
origin_concurrency = 1
min_start_spacing_ms = 500

[[origins]]
origin = "https://learn.microsoft.com"
origin_concurrency = 1
min_start_spacing_ms = 500

[[origins]]
origin = "https://www.postgresql.org"
origin_concurrency = 1
min_start_spacing_ms = 500

